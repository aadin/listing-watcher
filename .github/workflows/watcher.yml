name: Listing Watcher
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: listing-watcher
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_DEALS: ${{ secrets.DISCORD_WEBHOOK_DEALS }}
          DISCORD_WEBHOOK_MID_RANGE: ${{ secrets.DISCORD_WEBHOOK_MID_RANGE }}
          DISCORD_WEBHOOK_PREMIUM: ${{ secrets.DISCORD_WEBHOOK_PREMIUM }}
          DISCORD_WEBHOOK_SOLD: ${{ secrets.DISCORD_WEBHOOK_SOLD }}
        run: python main.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "update seen.json"
          git push